[package]
name = "beeper-core"
description = "Beeper cloud sign-in client, data models, configuration, SQLite store, search index, platform helpers, and CSS theme compiler for beeper-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite"] }
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
mime = "0.3.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
matrix-sdk-crypto = { version = "0.19.1", default-features = false }
vodozemac = { version = "0.11.1", default-features = false, features = ["low-level-api"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
