[package]
name = "beeper-core"
description = "Beeper cloud sign-in client, data models, configuration, SQLite store, search index, platform helpers, and CSS theme compiler for beeper-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The stub homeserver and bridges of `bridge_stub` and the fixtures of `testing`, for the tests of other crates.
stub = []

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "qrcode"] }
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
mime = "0.3.17"
imagesize = "0.13"
image.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
ring = { version = "0.17.14", default-features = false }
aes = "0.9.4"
ctr = "0.10.1"
matrix-sdk-crypto = { version = "0.19.1", default-features = false }
vodozemac = { version = "0.11.1", default-features = false, features = ["low-level-api"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
foldhash = "0.2.0"
unicode-normalization = "0.1.26"
unicode-properties = "0.1.5"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
