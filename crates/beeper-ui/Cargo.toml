[package]
name = "beeper-ui"
description = "Native iced desktop interface for beeper-rs with the Beeper Desktop layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beeper-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
url = "2.5.8"
rodio = { version = "0.23", default-features = false, features = ["playback", "recording"] }
unicode-script = "0.5.8"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image.workspace = true
iced = { version = "0.14.0", default-features = false, features = ["svg", "image-without-codecs", "advanced", "linux-theme-detection", "wgpu-bare", "tiny-skia", "tokio", "x11", "wayland", "web-colors", "crisp"] }
spellbook = "0.4.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
hayro = "0.9.0"
qrcodegen = "1.8.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }
mac-notification-sys = "0.6.15"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_UI_Shell"] }
windows-registry = "0.6"


[dev-dependencies]
beeper-core = { workspace = true, features = ["stub"] }
iced_runtime = "0.14.0"
iced_test = "0.14.0"
iced_tiny_skia = { version = "0.14.1", default-features = false }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
