[package]
name = "beeper-ui"
description = "Native iced desktop interface for beeper-rs with the Beeper Desktop layout."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beeper-core.workspace = true
serde_json.workspace = true
tokio.workspace = true
png = "0.18"
rodio = { version = "0.23", default-features = false, features = ["playback", "recording", "wav"] }
unicode-script = "0.5.8"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
iced = { version = "0.14.0", default-features = false, features = ["svg", "image-without-codecs", "advanced", "linux-theme-detection", "wgpu-bare", "tiny-skia", "tokio", "x11", "wayland", "web-colors", "crisp"] }
opus-decoder = "0.1.1"
ogg = "0.9.2"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
zbus = { version = "5.19", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }
