name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 3.0.0
          make-default: false
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev weston xvfb mesa-vulkan-drivers
      - uses: AnimMouse/setup-ffmpeg@0633f1f6ad34ac671f07224b3c89b00386f0c717
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --nocapture
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/beeper_rs_*.png

  other-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: AnimMouse/setup-ffmpeg@0633f1f6ad34ac671f07224b3c89b00386f0c717
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --nocapture
