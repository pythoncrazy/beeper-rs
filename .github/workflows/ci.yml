name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 3.0.0
          make-default: false
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang libsqlite3-dev libxkbcommon-dev libwayland-dev weston xvfb mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --nocapture
