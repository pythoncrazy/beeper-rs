[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "4.3.176"
edition = "2021"
license = "MIT"
repository = "https://github.com/pythoncrazy/beeper-rs"

[workspace.dependencies]
beeper-core = { path = "crates/beeper-core" }
beeper-api = { path = "crates/beeper-api" }
beeper-ui = { path = "crates/beeper-ui" }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }

[package]
name = "beeper-rs"
description = "Unofficial, independent Rust client and server for the Beeper Desktop API protocol (not affiliated with Beeper Inc. or Automattic Inc.)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beeper-core.workspace = true
beeper-api.workspace = true
beeper-ui.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
unicode-width = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
x11rb = { version = "0.13.2", default-features = false }

[dev-dependencies]
iced = { version = "0.14.0", default-features = false }
iced_test = "0.14.0"
rusqlite.workspace = true

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
