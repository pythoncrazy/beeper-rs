[package]
name = "beeper-rs"
version = "4.3.176"
edition = "2021"
license = "MIT"
repository = "https://github.com/pythoncrazy/beeper-rs"
description = "Unofficial, independent Rust client and server for the Beeper Desktop API protocol (not affiliated with Beeper Inc. or Automattic Inc.)."

[lib]
name = "beeper_rs"
path = "src/lib.rs"

[[bin]]
name = "beeper-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "query", "tokio", "ws"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
