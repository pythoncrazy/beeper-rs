[package]
name = "beeper-rs"
version = "4.3.176"
edition = "2021"
license = "MIT"
repository = "https://github.com/pythoncrazy/beeper-rs"
description = "Unofficial, independent Rust client and server for the Beeper Desktop API protocol (not affiliated with Beeper Inc. or Automattic Inc.)."

[lib]
name = "beeper_rs"
path = "src/lib.rs"

[[bin]]
name = "beeper-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
