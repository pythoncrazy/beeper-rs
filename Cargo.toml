[package]
name = "beeper-rs"
version = "4.3.176"
edition = "2021"
license = "MIT"
repository = "https://github.com/pythoncrazy/beeper-rs"
description = "Unofficial, independent Rust client and server for the Beeper Desktop API protocol (not affiliated with Beeper Inc. or Automattic Inc.)."

[lib]
name = "beeper_rs"
path = "src/lib.rs"

[[bin]]
name = "beeper-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", default-features = false }
png = "0.18"
iced = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "wgpu-bare",
    "tiny-skia",
    "tokio",
    "image-without-codecs",
    "lazy",
    "x11",
    "wayland",
    "web-colors",
    "thread-pool",
    "crisp",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies.wgpu]
version = "27.0.1"
default-features = false
features = ["std", "parking_lot", "wgsl", "metal"]

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", default-features = false, features = ["bundled"] }
wgpu = { version = "27.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12"] }

[dev-dependencies]
iced_test = "0.14.0"

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
