[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "4.3.176"
edition = "2021"
license = "MIT"
repository = "https://github.com/pythoncrazy/beeper-rs"

[workspace.dependencies]
beeper-core = { path = "crates/beeper-core" }
beeper-api = { path = "crates/beeper-api" }
beeper-ui = { path = "crates/beeper-ui" }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", default-features = false }

[package]
name = "beeper-rs"
description = "Unofficial, independent Rust client and server for the Beeper Desktop API protocol (not affiliated with Beeper Inc. or Automattic Inc.)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
beeper-core.workspace = true
beeper-api.workspace = true
beeper-ui.workspace = true
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
iced = { version = "0.14.0", default-features = false }
iced_test = "0.14.0"
rusqlite.workspace = true

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
